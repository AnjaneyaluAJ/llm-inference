worker_processes 8;
events { worker_connections 16384; }
http {
 upstream eng {
  least_conn;
  server 127.0.0.1:8001;
  server 127.0.0.1:8002;
  keepalive 1024;
 }
 server {
  listen 8000;
  location / {
   proxy_pass http://eng;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_buffering off;
   proxy_read_timeout 3600s;
   proxy_send_timeout 3600s;
  }
 }
}
